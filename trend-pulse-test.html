<!--
  THROWAWAY TEST PAGE — not linked from index.html, not part of the production site.
  Exists only to exercise netlify/functions/generate-pulse.js (Phase 3.5 abuse gate)
  end-to-end during `netlify dev`. Delete once the real lead-capture form (with its
  own design) is built, or fold this wiring into it.

  Turnstile site key below is Cloudflare's official "always passes" TEST key
  (documented at https://developers.cloudflare.com/turnstile/troubleshooting/testing/),
  NOT the real TURNSTILE_SITE value — this session has no access to your real .env.
  Swap it for the real TURNSTILE_SITE value before testing against production behavior
  (the test key always succeeds, so it won't exercise real pass/fail branching).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>trend-pulse gate test (throwaway)</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  body{font-family:system-ui,sans-serif;max-width:480px;margin:40px auto;padding:0 16px;}
  .banner{background:#fee;border:1px solid #c00;padding:8px 12px;font-size:13px;margin-bottom:24px;}
  label{display:block;margin-top:12px;font-size:14px;font-weight:600;}
  input{width:100%;padding:8px;font-size:14px;box-sizing:border-box;margin-top:4px;}
  .fax-field{display:none;}
  button{margin-top:16px;padding:10px 20px;font-size:14px;cursor:pointer;}
  pre{background:#f4f4f4;padding:12px;margin-top:16px;white-space:pre-wrap;word-break:break-all;}
</style>
</head>
<body>
<div class="banner">Throwaway test page for the Phase 3.5 abuse gate. Not part of the real site.</div>

<form id="pulse-form">
  <label>Brand name
    <input type="text" name="brandName" required>
  </label>
  <label>Website
    <input type="text" name="website">
  </label>
  <label>Email
    <input type="email" name="email" required>
  </label>

  <!-- Honeypot: real users never see or fill this. Bots that autofill every field will. -->
  <div class="fax-field">
    <label>Fax
      <input type="text" name="fax" tabindex="-1" autocomplete="off">
    </label>
  </div>

  <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA"></div>

  <button type="submit">Get my Trend Pulse</button>
</form>

<pre id="result" hidden></pre>

<script>
const form = document.getElementById("pulse-form");
const resultEl = document.getElementById("result");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  resultEl.hidden = true;

  const formData = new FormData(form);
  const turnstileTokenEl = form.querySelector('[name="cf-turnstile-response"]');
  const payload = {
    brandName: formData.get("brandName"),
    website: formData.get("website"),
    email: formData.get("email"),
    fax: formData.get("fax"),
    turnstileToken: turnstileTokenEl ? turnstileTokenEl.value : "",
  };

  try {
    const res = await fetch("/.netlify/functions/generate-pulse", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));

    if (res.status === 403 && data.error === "verification_failed") {
      // Tokens are single-use and expire in ~300s — a user who sits on the form
      // will hit this legitimately. Reset the widget and let them resubmit,
      // no hard error.
      if (window.turnstile) window.turnstile.reset();
      resultEl.hidden = false;
      resultEl.textContent = "Verification expired — please submit again.";
      return;
    }

    resultEl.hidden = false;
    resultEl.textContent = `${res.status}\n${JSON.stringify(data, null, 2)}`;
  } catch (err) {
    resultEl.hidden = false;
    resultEl.textContent = "Request failed: " + err.message;
  }
});
</script>
</body>
</html>
